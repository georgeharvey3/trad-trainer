<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1e4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#25221a" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Spaced-repetition practice for traditional Irish tunes, with metronome and per-tune recordings."
    />

    <!-- Installed-app behaviour. The manifest's display:standalone is what drops
         the browser chrome; the apple-* metas cover iOS versions before 15.4,
         which ignore the manifest. Hrefs are base-prefixed at build time so they
         resolve under the /trad-trainer/ GitHub Pages subpath as well as locally. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trad Trainer" />
    <meta name="application-name" content="Trad Trainer" />

    <link rel="icon" href="%BASE_URL%favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <!-- iOS only reads apple-touch-icon; it must be a non-transparent PNG. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Trad Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
